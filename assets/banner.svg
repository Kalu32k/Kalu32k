<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b3b6f" />
    </linearGradient>
    <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#g)" />

  <!-- soft geometric shapes -->
  <g fill-opacity="0.06" fill="#ffffff">
    <circle cx="120" cy="60" r="90" />
    <rect x="720" y="30" width="220" height="120" rx="20" />
    <ellipse cx="520" cy="190" rx="260" ry="40" />
  </g>

  <!-- main text -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#ffffff" text-anchor="start">
    <text x="60" y="110" font-size="64" font-weight="700">Kalu</text>
    <text x="60" y="150" font-size="20" font-weight="500" fill="#d0e6ff">Full-stack & infrastructure</text>
    <text x="60" y="180" font-size="14" fill="#cfe7ff">Java • JavaScript • React • Spring Boot • Docker • MySQL</text>
  </g>

  <!-- small accent line -->
  <rect x="60" y="195" width="220" height="3" rx="1.5" fill="#56a0ff" opacity="0.9" />

  <!-- subtle signature -->
  <text x="880" y="235" font-size="12" fill="#9fbce8" text-anchor="end">github.com/Kalu32k</text>
</svg>
