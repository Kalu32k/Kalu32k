name: Auto refresh README

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  refresh-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README timestamp
        run: |
          ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          file=README.md
          if grep -q "<!-- AUTO_REFRESH:" "$file"; then
            sed -i "s/<!-- AUTO_REFRESH:.* -->/<!-- AUTO_REFRESH: $ts -->/" "$file"
          else
            echo "" >> "$file"
            echo "<!-- AUTO_REFRESH: $ts -->" >> "$file"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "chore: refresh README timestamp" || echo "no changes"
          git push
